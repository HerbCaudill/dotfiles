<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{TITLE}}</title>
    <style>
      {{FONT_FACE_CSS}}
      :root {
        --fg: #1f2328;
        --muted: #59636e;
        --bg: #fff;
        --subtle: #f6f8fa;
        --border: #d0d7de;
        --blue: #0969da;
        --green: #1a7f37;
        --red: #cf222e;
        --purple: #8250df;
        --code: #f6f8fa;
        --code-fg: #1f2328;
        --shadow: 0 1px 2px rgba(31, 35, 40, 0.06);
      }
      * {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.6 "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      }
      a {
        color: var(--blue);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      code,
      pre {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
      }
      code {
        border-radius: 4px;
        background: rgba(175, 184, 193, 0.2);
        padding: 0.15em 0.35em;
        font-size: 0.86em;
      }
      pre {
        margin: 0;
        overflow: auto;
        background: var(--code) !important;
        color: var(--code-fg);
        padding: 16px;
        white-space: pre-wrap;
        font-size: 13px;
        line-height: 1.55;
        tab-size: 2;
      }
      pre code {
        background: none;
        padding: 0;
        white-space: inherit;
        font-size: inherit;
      }
      .container {
        width: min(1040px, calc(100% - 32px));
        margin: 0 auto;
      }
      .hero {
        border-bottom: 1px solid var(--border);
        padding: 56px 0 32px;
      }
      h1,
      h2,
      h3,
      h4 {
        margin-top: 1.6em;
        margin-bottom: 0.55em;
        line-height: 1.25;
      }
      h1 {
        margin-top: 0;
        font-size: 2.4rem;
        letter-spacing: -0.025em;
      }
      h2 {
        border-bottom: 1px solid var(--border);
        padding-bottom: 0.35em;
        font-size: 1.8rem;
      }
      h3 {
        font-size: 1.3rem;
      }
      h4 {
        font-size: 1rem;
      }
      p,
      ul,
      ol {
        max-width: 78ch;
      }
      .lede {
        max-width: 70ch;
        color: var(--muted);
        font-size: 1.15rem;
      }
      .range {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 20px;
      }
      .chip {
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--subtle);
        padding: 3px 10px;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .toc {
        position: sticky;
        z-index: 20;
        top: 0;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.96);
        backdrop-filter: blur(8px);
      }
      .toc .container {
        display: flex;
        gap: 18px;
        overflow: auto;
        padding: 10px 0;
      }
      .toc a {
        color: var(--fg);
        white-space: nowrap;
        font-weight: 500;
        font-size: 0.9rem;
      }
      main {
        padding-bottom: 72px;
      }
      section {
        scroll-margin-top: 54px;
        padding-top: 22px;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        overflow: hidden;
        margin: 28px 0;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .summary div {
        border-right: 1px solid var(--border);
        background: var(--subtle);
        padding: 14px;
      }
      .summary div:last-child {
        border-right: 0;
      }
      .summary b {
        display: block;
        font-size: 1.45rem;
      }
      .summary span {
        color: var(--muted);
        font-size: 0.82rem;
      }
      .note {
        max-width: 80ch;
        margin: 20px 0;
        border-left: 4px solid var(--blue);
        border-radius: 0 6px 6px 0;
        background: #ddf4ff;
        padding: 12px 16px;
      }
      .note strong {
        display: block;
        margin-bottom: 2px;
        color: var(--fg);
      }
      .flow {
        display: flex;
        align-items: stretch;
        gap: 22px;
        overflow: auto;
        margin: 24px 0;
        padding: 2px;
      }
      .flow-step {
        position: relative;
        flex: 1;
        min-width: 150px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--subtle);
        padding: 13px;
      }
      .flow-step:not(:last-child)::after {
        position: absolute;
        top: 38%;
        right: -17px;
        content: "→";
        color: var(--muted);
        font-weight: 600;
      }
      .flow-step strong {
        display: block;
        margin-bottom: 5px;
      }
      .flow-step small {
        display: block;
        color: var(--muted);
        line-height: 1.4;
      }
      .comparison {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin: 20px 0;
      }
      .panel {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      .panel header {
        border-bottom: 1px solid var(--border);
        background: var(--subtle);
        padding: 9px 12px;
        font-weight: 600;
      }
      .panel .content {
        padding: 13px;
      }
      .panel pre {
        border-radius: 4px;
      }
      .code-block {
        overflow: hidden;
        margin: 18px 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        box-shadow: var(--shadow);
      }
      .code-block figcaption {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border-bottom: 1px solid var(--border);
        background: #eff2f5;
        padding: 9px 12px;
        color: var(--code-fg);
        font-size: 0.82rem;
      }
      .code-block figcaption a {
        color: var(--blue);
      }
      .deleted-label {
        color: var(--red);
      }
      .checks {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        margin: 18px 0;
      }
      .check {
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--subtle);
        padding: 12px;
      }
      .check strong{color:var(--fg)}
      .file-tools {
        position: sticky;
        z-index: 15;
        top: 41px;
        border-bottom: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.98);
        padding: 12px 0;
      }
      .file-search {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 12px;
        font: inherit;
      }
      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-top: 8px;
      }
      .filters button {
        cursor: pointer;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--subtle);
        padding: 4px 9px;
        font: 12px "IBM Plex Sans", ui-sans-serif, sans-serif;
      }
      .filters button.active {
        border-color: var(--blue);
        background: var(--blue);
        color: white;
      }
      .filters span {
        opacity: 0.7;
      }
      .file-list {
        display: grid;
        gap: 8px;
        margin-top: 12px;
      }
      .file-row[hidden] {
        display: none;
      }
      .file-card {
        min-width: 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: white;
        padding: 11px 12px;
      }
      .file-card:hover {
        background: var(--subtle);
      }
      .file-card-heading {
        display: flex;
        align-items: center;
        min-width: 0;
      }
      .file-status {
        display: inline-grid;
        flex: 0 0 auto;
        place-items: center;
        width: 16px;
        height: 16px;
        margin-right: 8px;
        border-radius: 3px;
        color: white;
        font: 9px "IBM Plex Mono", ui-monospace, monospace;
      }
      .file-status.added {
        background: var(--green);
      }
      .file-status.modified {
        background: var(--blue);
      }
      .file-status.deleted {
        background: var(--red);
      }
      .file-status.renamed {
        background: var(--purple);
      }
      .file-name {
        display: block;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font: 12px/1.35 "IBM Plex Mono", ui-monospace, monospace;
      }
      .rename-from {
        overflow: hidden;
        margin: 3px 0 0 24px;
        color: var(--muted);
        text-overflow: ellipsis;
        white-space: nowrap;
        font-size: 11px;
      }
      .file-description {
        max-width: none;
        margin: 6px 0 7px 24px;
        overflow-wrap: anywhere;
        color: var(--muted);
        font-size: 0.76rem;
        line-height: 1.4;
      }
      .file-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-left: 24px;
      }
      .file-tag {
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--subtle);
        padding: 1px 7px;
        color: #6e7781;
        font-size: 0.67rem;
      }
      .muted {
        color: var(--muted);
        font-size: 0.85rem;
      }
      .footer {
        border-top: 1px solid var(--border);
        padding: 28px 0;
        color: var(--muted);
        font-size: 0.85rem;
      }
      @media (max-width: 760px) {
        h1 {
          font-size: 2rem;
        }
        .comparison,
        .checks {
          grid-template-columns: 1fr;
        }
        .flow {
          flex-direction: column;
        }
        .flow-step:not(:last-child)::after {
          top: auto;
          right: auto;
          bottom: -22px;
          left: 48%;
          content: "↓";
        }
        .code-block figcaption {
          flex-direction: column;
          align-items: flex-start;
        }
        .toc .container {
          flex-wrap: wrap;
          gap: 6px 16px;
          padding: 8px 0;
        }
      }
      @media print {
        .toc,
        .file-tools {
          position: static;
        }
        .code-block {
          break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="container">
        <h1>{{TITLE}}</h1>
        <p class="lede">{{LEDE}}</p>
        {{META}} {{SUMMARY}}
      </div>
    </header>
    <nav class="toc"><div class="container">{{TOC}}</div></nav>
    <main class="container">{{SECTIONS}}</main>
    <footer class="footer"><div class="container">{{FOOTER}}</div></footer>
    <script>
      const search = document.getElementById("file-search")
      const rows = [...document.querySelectorAll(".file-row")]
      const buttons = [...document.querySelectorAll(".filters button")]
      const count = document.getElementById("file-count")
      let category = ""

      /** Apply the active text and category filters to the file cards. */
      function filterFiles() {
        if (!search || !count) return
        const query = search.value.trim().toLowerCase()
        let shown = 0
        for (const row of rows) {
          const matchesQuery = !query || row.dataset.search.includes(query)
          const matchesCategory = !category || row.dataset.categories.includes(`|${category}|`)
          const visible = matchesQuery && matchesCategory
          row.hidden = !visible
          if (visible) shown += 1
        }
        count.textContent = `Showing ${shown} of ${rows.length} files.`
      }

      search?.addEventListener("input", filterFiles)
      for (const button of buttons) {
        button.addEventListener("click", () => {
          category = button.dataset.category
          for (const candidate of buttons) {
            candidate.classList.toggle("active", candidate === button)
          }
          filterFiles()
        })
      }
    </script>
  </body>
</html>
